[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phy-informed-mimo-ris-env"
version = "0.1.0"
description = "GPU-native RIS-assisted MIMO statistical environment and Symmetric Gamma-Gamma q05 label engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "pyarrow>=15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
