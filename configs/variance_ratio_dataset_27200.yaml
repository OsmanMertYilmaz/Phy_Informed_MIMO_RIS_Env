project: variance_ratio_hierarchical_v1
seed: 20260903
channel_model: case2_shared_ray_polarization_phases

environments:
  total_banks: 27200
  split:
    train: 19040
    validation: 4080
    final_test: 4080
  split_per_family:
    train: 4760
    validation: 1020
    final_test: 1020
  scenario_families:
    Indoor-Office: 6800
    UMi: 6800
    UMa: 6800
    RMa: 6800
  geometry_split: controlled_interpolation_10x10_cells

geometry:
  families:
    Indoor-Office:
      dist_BR_m: [5.0, 45.0]
      dist_RU_m: [3.0, 35.0]
      gnb_height_m: [2.3, 4.0]
      ue_height_m: [1.0, 2.2]
    UMi:
      dist_BR_m: [30.0, 250.0]
      dist_RU_m: [10.0, 180.0]
      gnb_height_m: [10.0, 22.0]
      ue_height_m: [1.2, 3.0]
    UMa:
      dist_BR_m: [70.0, 500.0]
      dist_RU_m: [35.0, 300.0]
      gnb_height_m: [25.0, 35.0]
      ue_height_m: [1.2, 3.0]
    RMa:
      dist_BR_m: [150.0, 1200.0]
      dist_RU_m: [50.0, 800.0]
      gnb_height_m: [25.0, 50.0]
      ue_height_m: [1.2, 3.5]
  distance_bins_per_link: 10
  banks_per_geometry_cell: 68
  ris_position_m: [0.0, 0.0, 0.0]
  require_no_exact_split_geometry_overlap: true
  require_val_test_inside_train_cell_envelope: true

carrier_frequencies_hz:
  - 2000000000
  - 2600000000
  - 3500000000
  - 3600000000
  - 4900000000
  - 6000000000

arrays:
  dual_polarization: true
  polarization_angles_deg: [45, -45]
  nT_min: 4
  tx_spatial_shapes: [[2, 1], [2, 2], [4, 1], [4, 2]]
  rx_spatial_shapes: [[1, 1], [2, 1], [2, 2], [4, 1]]
  nRIS_values: [64, 128, 256, 512]

rng:
  channel_seed_base: 900000
  ris_seed: 20260903

candidates_per_bank:
  W: 32
  Z_per_W: 512
  total_rows: 16384

W_pool:
  requirement: unique_type1_rank1
  codebook_mode: 1
  layers: 1
  pilot_selected: 8
  coverage_fill: 24
  pilot_stream_independent_of_mc_labels: true

Z_pool:
  canonical_total: 480
  optimized_per_W: 32
  canonical:
    anchor: {total: 4, train: 3, holdout: 1}
    block: {total: 64, train: 45, holdout: 19}
    structured: {total: 64, train: 45, holdout: 19}
    random: {total: 348, train: 243, holdout: 105}
  optimization_seed_source: random_train
  optimization_seed_count: 8
  optimization_seed_order: deterministic_max_min_hamming
  optimized:
    objectives: [muSNR_max, wickCV2_min, wickCV2_max, Neff_min]
    sweeps: 1
    duplicate_fallback: next_diverse_seed

monte_carlo:
  base_realizations: 64000
  maximum_realizations: 512000
  variance_normalization: population
  channel_rng_native_cuda: true
  common_random_numbers_across_candidates: true
  adaptive_policy: adaptive_logq_stability_v1

label:
  canonical_target: targetLogVarRatio
  definition: log(varEmpMC)-log(sigma2Wick)
  inference: sigma2Wick*exp(targetLogVarRatio)
  hierarchy: [targetBankMean, targetDeltaW, targetDeltaZ]

diagnostics_to_store:
  - meanEmpMC
  - varEmpMC
  - N_MC_used
  - mcConverged
  - mcRefined
  - mcEarlyP99
  - mcFinalP90Delta
  - targetIdentityError
  - lookupClamped
  - isReliable
  - isDuplicate

forbidden_model_inputs:
  - meanEmpMC
  - varEmpMC
  - targetLogVarRatio
  - targetBankMean
  - targetBankStd
  - targetWMean
  - targetWStd
  - targetDeltaW
  - targetDeltaZ
  - varRatio
  - cv2
  - isOptimized
